[package]
name = "resumekit-desktop"
version = "0.1.0"
description = "ResumeKit desktop client"
authors = ["ResumeKit"]
edition = "2021"

[lib]
name = "resumekit_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-http = "2"
tempfile = "3"
zeroize = "1"
